name: Alcatel-lucent
description: 'Alcatel-Lucent was a French-American telecommunications equipment company
  formed in 2006 from the merger of Alcatel (France) and Lucent Technologies (USA, the former
  Bell Labs / AT&T systems business). It supplied fixed, mobile, and converged broadband
  networking hardware, IP routing, optical transport, and communications services to carriers
  and enterprises worldwide. Nokia acquired Alcatel-Lucent in 2016 and its product lines and
  Bell Labs research arm were absorbed into Nokia; the standalone brand and developer surface
  have since been retired. This profile was surfaced as a portfolio lead and is retained as a
  historical company record in the API Evangelist network; no independent public API developer
  portal is currently operated under the alcatel-lucent.com domain.'
